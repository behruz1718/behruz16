<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Харажатлар ҳисоби</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b2033;--mut:#6b738c;--pr:#5b5bf0;--pr2:#8a5cf6;--ok:#12a36b;--bad:#e5484d;--bd:#e4e7f2;--chip:#eceefb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mut:#9aa2c0;--bd:#262b45;--chip:#222844}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mut:#9aa2c0;--bd:#262b45;--chip:#222844}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(91,91,240,.3)}
.hero small{opacity:.85}
.hero .big{font-size:34px;font-weight:800;margin:4px 0}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:14px;border:1px solid var(--bd)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:16px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
.row{display:flex;gap:8px}
.btn{border:0;background:var(--pr);color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item b{color:var(--bad)}
.item .d{color:var(--mut);font-size:12px}
.x{border:0;background:var(--chip);color:var(--bad);width:30px;height:30px;border-radius:8px;cursor:pointer;margin-left:10px;font-size:16px}
.empty{text-align:center;color:var(--mut);padding:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:0;background:var(--chip);color:var(--tx);padding:8px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.chips button.on{background:var(--pr);color:#fff}
.chips button .s{display:block;font-size:10px;opacity:.7;font-weight:500}
.day{font-weight:700;margin:12px 0 2px;display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.disp{background:var(--bg);border-radius:12px;padding:12px;text-align:right;margin-bottom:10px;border:1px solid var(--bd)}
.disp .e{color:var(--mut);min-height:20px;word-break:break-all;font-size:14px}
.disp .r{font-size:30px;font-weight:800;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:16px 0;font-size:20px;font-weight:700;border:0;border-radius:12px;background:var(--chip);color:var(--tx);cursor:pointer}
.keys .op{background:var(--pr);color:#fff}
.keys .eq{background:var(--ok);color:#fff}
.keys .cl{background:var(--bad);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center}
.th{background:none;border:0;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h2 style="margin:0">💰 Харажатлар</h2><button class="th" id="th" aria-label="Мавзу">🌓</button></div>
  <div class="hero" style="margin-top:12px"><small id="hd"></small><div class="big" id="ht">0 сўм</div><small id="hc"></small></div>
  <div class="tabs">
    <button data-t="today" class="on">Бугун</button>
    <button data-t="months">Ойлар</button>
    <button data-t="calc">Калькулятор</button>
  </div>

  <div id="today">
    <div class="card">
      <h3>Янги харажат</h3>
      <input id="nm" placeholder="Нима олдингиз? (масалан: нон)">
      <div class="row"><input id="am" type="number" inputmode="decimal" placeholder="Сумма (сўм)"><input id="dt" type="date" style="max-width:160px"></div>
      <button class="btn" id="add">＋ Қўшиш</button>
    </div>
    <div class="card"><h3>Бугунги харажатлар</h3><div id="tl"></div></div>
  </div>

  <div id="months" hidden>
    <div class="card">
      <div class="row" style="margin-bottom:10px;align-items:center"><button class="x" id="py">‹</button><b id="yr" style="flex:1;text-align:center"></b><button class="x" id="ny">›</button></div>
      <div class="chips" id="mc"></div>
      <div class="hero" style="margin:0 0 10px;padding:14px"><small id="mn"></small><div class="big" style="font-size:26px" id="mt"></div></div>
      <div id="ml"></div>
    </div>
  </div>

  <div id="calc" hidden>
    <div class="card">
      <div class="disp"><div class="e" id="ce"></div><div class="r" id="cr">0</div></div>
      <div class="keys" id="keys"></div>
      <button class="btn" id="use" style="margin-top:10px;background:var(--ok)">Харажат сифатида ўтказиш →</button>
    </div>
  </div>
</div>
<script>
var MN=["Январ","Феврал","Март","Апрел","Май","Июн","Июл","Август","Сентябр","Октябр","Ноябр","Декабр"];
var KEY="xarajat_v1",data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function fmt(n){return (Math.round(n*100)/100).toLocaleString("ru-RU")+" сўм"}
var today=iso(new Date()),vy=new Date().getFullYear(),vm=new Date().getMonth();
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function itemHTML(x){return '<div class="item"><div><div>'+esc(x.n)+'</div><div class="d">'+x.d+'</div></div><div style="display:flex;align-items:center"><b>−'+fmt(x.a)+'</b><button class="x" data-del="'+x.id+'">✕</button></div></div>'}
function sum(a){return a.reduce(function(s,x){return s+x.a},0)}
function render(){
  var t=data.filter(function(x){return x.d===today});
  $("hd").textContent="Бугунги харажат";$("ht").textContent=fmt(sum(t));$("hc").textContent=t.length+" та харажат";
  $("tl").innerHTML=t.length?t.slice().reverse().map(itemHTML).join(""):'<div class="empty">Бугун ҳали харажат йўқ</div>';
  $("yr").textContent=vy;
  var h="";
  for(var i=0;i<12;i++){var p=i<9?"0"+(i+1):""+(i+1);var s=sum(data.filter(function(x){return x.d.indexOf(vy+"-"+p)===0}));
    h+='<button data-m="'+i+'" class="'+(i===vm?"on":"")+'">'+MN[i]+'<span class="s">'+(s?Math.round(s).toLocaleString("ru-RU"):"—")+'</span></button>'}
  $("mc").innerHTML=h;
  var pm=vm<9?"0"+(vm+1):""+(vm+1);
  var ml=data.filter(function(x){return x.d.indexOf(vy+"-"+pm)===0}).sort(function(a,b){return a.d<b.d?1:-1});
  $("mn").textContent=MN[vm]+" "+vy+" — жами";$("mt").textContent=fmt(sum(ml));
  var g={},o="";ml.forEach(function(x){(g[x.d]=g[x.d]||[]).push(x)});
  Object.keys(g).sort().reverse().forEach(function(d){o+='<div class="day"><span>'+d.split("-").reverse().join(".")+'</span><span>'+fmt(sum(g[d]))+'</span></div>'+g[d].map(itemHTML).join("")});
  $("ml").innerHTML=o||'<div class="empty">Бу ойда харажат йўқ</div>';
}
$("dt").value=today;
$("add").onclick=function(){
  var n=$("nm").value.trim(),a=parseFloat($("am").value);
  if(!n||!(a>0)){alert("Номи ва суммани тўғри киритинг");return}
  data.push({id:Date.now(),n:n,a:a,d:$("dt").value||today});save();
  $("nm").value="";$("am").value="";render();
};
document.addEventListener("click",function(e){
  var d=e.target.getAttribute("data-del");
  if(d&&confirm("Ўчирилсинми?")){data=data.filter(function(x){return String(x.id)!==d});save();render()}
  var m=e.target.closest("[data-m]");if(m){vm=+m.getAttribute("data-m");render()}
});
$("py").onclick=function(){vy--;render()};$("ny").onclick=function(){vy++;render()};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b)});
  ["today","months","calc"].forEach(function(t){$(t).hidden=t!==b.getAttribute("data-t")});
}});
/* калькулятор */
var ex="",rs="0";
var K=["C","⌫","÷","×","7","8","9","−","4","5","6","+","1","2","3","=","0","00",".","( )"];
$("keys").innerHTML=K.map(function(k){var c="";if("÷×−+".indexOf(k)>-1)c="op";if(k==="=")c="eq";if(k==="C")c="cl";return '<button class="'+c+'" data-k="'+k+'">'+k+'</button>'}).join("");
function ev(){
  var s=ex.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-");
  if(!/^[0-9+\-*\/.() ]+$/.test(s))return null;
  try{var v=Function('"use strict";return ('+s+')')();return isFinite(v)?Math.round(v*1e6)/1e6:null}catch(e){return null}
}
function cshow(){$("ce").textContent=ex;var v=ev();$("cr").textContent=ex&&v!==null?v.toLocaleString("ru-RU"):(ex?"…":"0")}
$("keys").onclick=function(e){
  var k=e.target.getAttribute("data-k");if(!k)return;
  if(k==="C")ex="";
  else if(k==="⌫")ex=ex.slice(0,-1);
  else if(k==="=");
  else if(k==="( )"){var o=(ex.match(/\(/g)||[]).length,c=(ex.match(/\)/g)||[]).length;ex+=(o>c&&/[0-9)]$/.test(ex))?")":"("}
  else ex+=k;
  if(k==="="){var v=ev();if(v!==null)ex=String(v)}
  cshow();
};
$("use").onclick=function(){
  var v=ev();if(v===null||v<=0){alert("Аввал ҳисобланг");return}
  $("am").value=v;document.querySelector('[data-t="today"]').click();$("nm").focus();
};
$("th").onclick=function(){var r=document.documentElement;var d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
render();cshow();
</script>
</body>
</html>
